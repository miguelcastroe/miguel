name: Apply internal analytics exclusion

on:
  push:
    branches:
      - exclude-internal-analytics
    paths:
      - .github/workflows/apply-internal-analytics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exclude-internal-analytics

      - name: Replace GA4 snippets with shared loader
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          measurement_id = "G-29HHTM40HS"
          replacement = '<script src="/analytics.js"></script>'
          pattern = re.compile(
              r'<script async src="https://www\.googletagmanager\.com/gtag/js\?id=' + re.escape(measurement_id) + r'"></script>\s*'
              r'<script>.*?gtag\(\s*["\']config["\']\s*,\s*["\']' + re.escape(measurement_id) + r'["\']\s*\);.*?</script>',
              re.DOTALL,
          )

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              new_text, count = pattern.subn(replacement, text)
              if count:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append((str(path), count))

          if not changed:
              raise SystemExit('No GA4 snippets were replaced.')

          print('Updated:')
          for path, count in changed:
              print(f'  {path}: {count}')
          PY

      - name: Commit patched pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use device-based GA4 exclusion across site"
          git push origin HEAD:exclude-internal-analytics
