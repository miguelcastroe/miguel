name: Migrate portfolio SEO

on:
  push:
    paths:
      - '.github/workflows/migrate-portfolio-seo.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update canonical URLs and structured data
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('https://miguelcastroe.github.io/miguel/?v=2026', 'https://miguelcastro.works/'),
              ('https://miguelcastroe.github.io/miguel/og-image.jpg', 'https://miguelcastro.works/og-image.jpg'),
              ('https://miguelcastroe.github.io/miguel/', 'https://miguelcastro.works/'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)

          schema = '''\n<!-- Structured data -->\n<script type="application/ld+json">\n{\n  "@context": "https://schema.org",\n  "@type": "ProfilePage",\n  "@id": "https://miguelcastro.works/#profile-page",\n  "url": "https://miguelcastro.works/",\n  "name": "Miguel Castro | Creative Director",\n  "mainEntity": {\n    "@type": "Person",\n    "@id": "https://miguelcastro.works/#miguel-castro",\n    "name": "Miguel Castro",\n    "url": "https://miguelcastro.works/",\n    "jobTitle": "Creative Director",\n    "sameAs": [\n      "https://www.linkedin.com/in/miguelcastroe/"\n    ],\n    "award": [\n      "Cannes Lions Grand Prix — Innovation"\n    ],\n    "knowsAbout": [\n      "Creative Direction",\n      "Creative Strategy",\n      "Advertising",\n      "Innovation",\n      "Emerging Technology"\n    ]\n  }\n}\n</script>\n'''

          if 'https://miguelcastro.works/#miguel-castro' not in text:
              marker = '<!-- Theme / Browser -->'
              if marker not in text:
                  raise SystemExit('Expected head marker not found; refusing to modify index.html')
              text = text.replace(marker, schema + '\n' + marker, 1)

          if 'https://miguelcastroe.github.io/miguel/' in text:
              raise SystemExit('Legacy canonical URL remains in index.html')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate changes
        run: |
          grep -q '<link rel="canonical" href="https://miguelcastro.works/">' index.html
          grep -q 'https://miguelcastro.works/#miguel-castro' index.html
          ! grep -q 'https://miguelcastroe.github.io/miguel/' index.html
          git diff --check

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix canonical portfolio SEO"
          git push
